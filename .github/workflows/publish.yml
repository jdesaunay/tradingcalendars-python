# Publishes to PyPI when a GitHub release is published (PyPI "trusted publishing":
# no API token stored anywhere). One-time setup on pypi.org: see PUBLISHING.md.
name: publish
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build pytest && python -m pytest -q && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
